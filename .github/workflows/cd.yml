name: CD Pipeline

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]

env:
  AWS_REGION: us-west-2
  ECR_REPOSITORY: optimus-python-hello-repo
  EB_APPLICATION_NAME: Optimus-AI
  EB_ENVIRONMENT_NAME: testing
  AWS_ACCOUNT_ID: 137360334857

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ${{ env.AWS_REGION }}
    
    - name: Login to Amazon ECR
      id: login-ecr
      uses: aws-actions/amazon-ecr-login@v2
    
    - name: Build, tag, and push image to Amazon ECR
      id: build-image
      env:
        ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        IMAGE_TAG: ${{ github.sha }}
      run: |
        # Build Docker image
        docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG .
        docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:latest .
        
        # Push images to ECR
        docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
        docker push $ECR_REGISTRY/$ECR_REPOSITORY:latest
        
        echo "image=$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" >> $GITHUB_OUTPUT
        echo "image-uri=$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" >> $GITHUB_OUTPUT
    
    - name: Generate Dockerrun.aws.json (Version 1 for single container)
      run: |
        cat > Dockerrun.aws.json << EOF
        {
          "AWSEBDockerrunVersion": "1",
          "Image": {
            "Name": "${{ steps.build-image.outputs.image-uri }}",
            "Update": "true"
          },
          "Ports": [
            {
              "ContainerPort": "5000"
            }
          ],
          "Volumes": [],
          "Logging": "/var/log/nginx"
        }
        EOF
        
        echo "Generated Dockerrun.aws.json:"
        cat Dockerrun.aws.json
    
    - name: Generate deployment package
      run: |
        zip -r deploy-${{ github.sha }}.zip Dockerrun.aws.json
        
        echo "Deployment package contents:"
        unzip -l deploy-${{ github.sha }}.zip
    
    - name: Deploy to Elastic Beanstalk
      uses: einaregilsson/beanstalk-deploy@v22
      with:
        aws_access_key: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws_secret_key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        application_name: ${{ env.EB_APPLICATION_NAME }}
        environment_name: ${{ env.EB_ENVIRONMENT_NAME }}
        region: ${{ env.AWS_REGION }}
        version_label: v${{ github.run_number }}-${{ github.sha }}
        deployment_package: deploy-${{ github.sha }}.zip
        wait_for_environment_recovery: 300
    
    - name: Verify deployment
      run: |
        echo "✅ Deployment completed successfully!"
        echo "🐳 Docker Image: ${{ steps.build-image.outputs.image-uri }}"
        echo "🌐 Application URL: https://testing.eba-pzebzmdm.us-west-2.elasticbeanstalk.com"
        echo "📊 Version: v${{ github.run_number }}-${{ github.sha }}"
        
        # Wait a moment for the deployment to be ready
        echo "⏳ Waiting for deployment to stabilize..."
        sleep 60
        
        # Health check
        echo "🔍 Performing health check..."
        if curl -f -s https://testing.eba-pzebzmdm.us-west-2.elasticbeanstalk.com/health; then
          echo "✅ Health check passed!"
        else
          echo "⚠️ Health check failed, but deployment may still be starting up"
          echo "Check the application manually at: https://testing.eba-pzebzmdm.us-west-2.elasticbeanstalk.com"
        fi