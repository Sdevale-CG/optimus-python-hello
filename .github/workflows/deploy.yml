
on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

env:
  AWS_REGION: us-west-2
  ECR_REPOSITORY: optimus-python-hello
  EB_APPLICATION_NAME: optimus-python-app
  EB_ENVIRONMENT_NAME: optimus-python-env
  AWS_ACCOUNT_ID: 137360334857

jobs:
  test:
    name: 🧪 Run Tests
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.9'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest

    - name: Test Flask app
      run: |
        python -c "
        from app import app
        with app.test_client() as client:
            rv = client.get('/')
            assert rv.status_code == 200
            print('✅ App test passed!')
            
            rv = client.get('/health')
            assert rv.status_code == 200
            print('✅ Health check passed!')
        "

  build-and-deploy:
    name: 🏗️ Build & Deploy
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main'
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ${{ env.AWS_REGION }}

    - name: Login to Amazon ECR
      id: login-ecr
      uses: aws-actions/amazon-ecr-login@v2

    - name: Build, tag, and push image to Amazon ECR
      id: build-image
      env:
        ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        IMAGE_TAG: ${{ github.sha }}
        SHORT_SHA: ${{ github.sha }}
      run: |
        echo "Building Docker image..."
        
        # Build image with multiple tags
        docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG .
        docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:latest .
        
        echo "Pushing images to ECR..."
        docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
        docker push $ECR_REGISTRY/$ECR_REPOSITORY:latest
        
        echo "✅ Image pushed successfully!"
        echo "image=$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" >> $GITHUB_OUTPUT
        echo "image-uri=$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" >> $GITHUB_OUTPUT

    - name: Update Dockerrun.aws.json
      env:
        ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        IMAGE_TAG: ${{ github.sha }}
      run: |
        echo "Updating Dockerrun.aws.json with new image URI..."
        NEW_IMAGE_URI="$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"
        sed -i "s|137360334857.dkr.ecr.us-west-2.amazonaws.com/optimus-python-hello:latest|$NEW_IMAGE_URI|g" Dockerrun.aws.json
        echo "Updated image URI to: $NEW_IMAGE_URI"

    - name: Create deployment package
      run: |
        echo "Creating deployment package..."
        zip -r deploy.zip Dockerrun.aws.json
        ls -la deploy.zip
        echo "✅ Deployment package created!"

    - name: Deploy to Elastic Beanstalk
      uses: einaregilsson/beanstalk-deploy@v22
      with:
        aws_access_key: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws_secret_key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        application_name: ${{ env.EB_APPLICATION_NAME }}
        environment_name: ${{ env.EB_ENVIRONMENT_NAME }}
        version_label: "v-${{ github.sha }}"
        region: ${{ env.AWS_REGION }}
        deployment_package: deploy.zip
        wait_for_environment_recovery: 300

    - name: 🎉 Deployment Success
      run: |
        echo "🎉 Deployment completed successfully!"
        echo "🌍 Your app should be available at your Elastic Beanstalk URL"
        echo "📝 Deployment details:"
        echo "   - Image: ${{ steps.build-image.outputs.image-uri }}"
        echo "   - Version: v-${{ github.sha }}"
        echo "   - Region: ${{ env.AWS_REGION }}"