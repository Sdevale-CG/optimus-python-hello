name: 🚀 Optimus CI/CD Pipeline

on:
  push:
    branches: [ main ]

env:
  AWS_REGION: us-west-2
  EB_APPLICATION_NAME: Optimus-AI
  EB_ENVIRONMENT_NAME: testing
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  test:
    name: 🧪 Run Tests
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.9'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Test Flask app
      run: |
        python -c "
        from app import app
        with app.test_client() as client:
            rv = client.get('/')
            assert rv.status_code == 200
            print('✅ App test passed!')
            
            rv = client.get('/health')
            assert rv.status_code == 200
            print('✅ Health check passed!')
        "

  build-and-deploy:
    name: 🏗️ Build & Deploy
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: read
      packages: write
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Login to GitHub Container Registry
      uses: docker/login-action@v3
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Extract metadata
      id: meta
      uses: docker/metadata-action@v5
      with:
        images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
        tags: |
          type=ref,event=branch
          type=ref,event=pr
          type=sha,prefix={{branch}}-
          type=raw,value=latest

    - name: Build and push Docker image
      uses: docker/build-push-action@v5
      with:
        context: .
        push: true
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}

    - name: Update Dockerrun.aws.json
      run: |
        # Use the GitHub Container Registry image
        NEW_IMAGE="ghcr.io/sdevale-cg/optimus-python-hello:main-${{ github.sha }}"
        echo "Updating Dockerrun.aws.json with image: $NEW_IMAGE"
        
        # Update the Dockerrun.aws.json
        cat > Dockerrun.aws.json << EOF
        {
          "AWSEBDockerrunVersion": 2,
          "containerDefinitions": [
            {
              "name": "optimus-python-app",
              "image": "$NEW_IMAGE",
              "essential": true,
              "memory": 512,
              "portMappings": [
                {
                  "hostPort": 80,
                  "containerPort": 5000,
                  "protocol": "tcp"
                }
              ],
              "environment": [
                {
                  "name": "APP_VERSION",
                  "value": "1.0"
                }
              ]
            }
          ]
        }
        EOF
        
        echo "✅ Dockerrun.aws.json updated"
        cat Dockerrun.aws.json

    - name: Create deployment package
      run: |
        zip -r deploy.zip Dockerrun.aws.json
        echo "✅ Deployment package created"

    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ${{ env.AWS_REGION }}

    - name: Deploy to Elastic Beanstalk
      uses: einaregilsson/beanstalk-deploy@v22
      with:
        aws_access_key: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws_secret_key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        application_name: ${{ env.EB_APPLICATION_NAME }}
        environment_name: ${{ env.EB_ENVIRONMENT_NAME }}
        version_label: "github-${{ github.sha }}"
        region: ${{ env.AWS_REGION }}
        deployment_package: deploy.zip
        wait_for_environment_recovery: 300

    - name: 🎉 Deployment Success
      run: |
        echo "🎉 Deployment completed successfully!"
        echo "🌍 Your app is available at: https://testing.eba-pzebzmdm.us-west-2.elasticbeanstalk.com"
        echo "📦 Image: ghcr.io/sdevale-cg/optimus-python-hello:main-${{ github.sha }}"
        echo "🏷️ Version: github-${{ github.sha }}"